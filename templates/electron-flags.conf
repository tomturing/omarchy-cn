# ==============================================================================
# Omarchy 平台通用 Electron / Wayland 中文输入法调优参数模板
# 存放位置建议: ~/.config/<app>-flags.conf (例如: codebuddy-ide-cn-flags.conf, workbuddy-flags.conf)
# ==============================================================================

# 1. 强制启用原生 Wayland 协议与窗口后端
--ozone-platform=wayland
--ozone-platform-hint=wayland

# 2. 启用 Wayland 文本输入法 (Fcitx5) 上下文连接
--enable-wayland-ime

# 3. 核心防御: 锁定使用 text-input-v1 协议
# 彻底规避 Chromium 138 C++ 状态机在 text-input-v3 下清空预编辑时的按键泄漏 (防止退格跳行首)
--wayland-text-input-version=1

# 4. 窗口装饰与原生标题栏渲染
--enable-features=WaylandWindowDecorations

# 5. GPU 合成与图形驱动稳定性
# 禁用在 Wayland 表面初始化时导致崩溃的 Vulkan，启用 ANGLE OpenGL 渲染管道
--use-gl=angle
--disable-features=Vulkan

# 6. 桌面密钥环弹窗拦截
# 避免 Hyprland 桌面环境下每次冷启动弹出阻塞式的系统密钥环解锁密码框
--password-store=basic
