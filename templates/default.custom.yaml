# 存放路径: ~/.local/share/fcitx5/rime/default.custom.yaml
patch:
  schema_list:
    - schema: rime_ice           # 雾凇拼音（首选）
    - schema: luna_pinyin        # 明月拼音

  # 原生修饰键状态机：单按松开才切换，长按组合键绝不误切
  "ascii_composer/switch_key/Shift_L": commit_code
  "ascii_composer/switch_key/Shift_R": commit_code

  # 标点映射：全角/半角均输出半角英文字符 !
  "punctuator/half_shape/!": "!"
  "punctuator/full_shape/!": "!"

  # 注意：应用程序级别的初始英文策略请配置在 fcitx5.yaml 中，
  # 切勿在此处配置 app_options，否则会被 Rime 引擎层硬性锁死在英文无法通过 Shift 切换。
