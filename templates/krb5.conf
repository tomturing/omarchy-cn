# Omarchy 推荐的优化版 /etc/krb5.conf
# 移除上游占位的 ATHENA.MIT.EDU 默认域，并关闭 DNS KDC 自动解析
# 彻底解决 FreeRDP / Remmina 在 NLA 认证握手阶段长达 60~80 秒假死超时的问题

[libdefaults]
    dns_lookup_kdc = false
    dns_lookup_realm = false
# default_realm = ATHENA.MIT.EDU

[realms]
# 如有实际企业内网 Kerberos/AD 域控需求，在此处显式指定真实 KDC：
#   EXAMPLE.COM = {
#       kdc = 192.168.1.10:88
#       admin_server = 192.168.1.10:749
#   }

[domain_realm]
#   .example.com = EXAMPLE.COM
#   example.com = EXAMPLE.COM

[logging]
#   kdc = CONSOLE
