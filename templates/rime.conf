# Rime addon configuration for Fcitx5
# 存放路径: ~/.config/fcitx5/conf/rime.conf

# 核心：必须显式将 Rime 内部状态隔离设为跟随全局（Follow Global Configuration）！
# 底层根因：Fcitx5-Rime 内部默认使用 InputState=All 全局共享会话，完全无视全局的 ShareInputState=Program，
# 导致各窗口共享同一套 Rime 会话，且无法对新打开的窗口（如 quickshell / polkit）触发 app_options 英文策略。
InputState="Follow Global Configuration"
