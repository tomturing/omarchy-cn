# 路由与级联降级策略
router_settings:
  routing_strategy: "usage-based-routing"
  context_window_fallbacks:
    - local-auto: ["local-precise", "local-infinite"]
    - local-fast: ["local-infinite"]
    - local-precise: ["local-infinite"]
  fallbacks:
    - local-auto: ["node1-qwen", "node2-qwen", "node3-qwen"]
    - local-fast: ["node1-qwen", "node2-qwen", "node3-qwen"]
    - claude-3-7-sonnet-20250219: ["node2-qwen", "node3-qwen"]
    - deepseek-flash: ["node2-qwen", "node3-qwen"]
    - deepseek-v4-flash: ["node2-qwen", "node3-qwen"]
    - deepseek-v4-pro: ["node3-qwen", "node1-qwen"]
    - deepseek-chat: ["node2-qwen", "node3-qwen"]
    - deepseek-reasoner: ["node3-qwen", "node1-qwen"]
    - qwen-plus: ["local-auto", "local-infinite"]

# 全局通用配置
general_settings:
  master_key: sk-local-litellm-master-key

# 可观测性配置 (Prometheus + Langfuse)
litellm_settings:
  callbacks: ["prometheus", "langfuse"]
  require_auth_for_metrics_endpoint: false
  json_logs: true
  drop_params: true
  telemetry: false
