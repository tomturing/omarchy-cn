# Langfuse v2 单机轻量部署编排模板
# 注意：本文件为通用模板。真实密码与加密密钥建议保存在本地 ~/.config/langfuse/.env 中。
# 本地生成密钥指令参考：
#   NEXTAUTH_SECRET=$(openssl rand -hex 32)
#   SALT=$(openssl rand -hex 16)
#   ENCRYPTION_KEY=$(openssl rand -hex 32)

services:
  postgres:
    image: postgres:15-alpine
    container_name: langfuse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse_password_secure}
      POSTGRES_DB: langfuse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: langfuse-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-langfuse_password_secure}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your_nextauth_secret_generate_with_openssl_rand_hex_32}
      SALT: ${SALT:-your_salt_generate_with_openssl_rand_hex_16}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your_encryption_key_generate_with_openssl_rand_hex_32}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
