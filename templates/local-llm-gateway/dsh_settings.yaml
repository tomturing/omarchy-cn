        id: local-precise
        name: 'Node 2: Windows 22 高精版 (Q8_0 准无损, 30 t/s)'
      - contextWindow: 262144
        id: local-infinite
        name: 'Node 3: Omarchy 23 满血长文本 (256K Context)'
